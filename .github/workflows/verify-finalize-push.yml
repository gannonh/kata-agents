name: Verify finalize push

# Throwaway workflow: proves the finalize job's push mechanism works in CI —
# the built-in GITHUB_TOKEN (contents: write) pushing a commit to main. Mirrors
# the finalize job's checkout + identity + push exactly. Delete after verifying.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Push an empty commit to main via GITHUB_TOKEN
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ci: verify finalize push capability"
          git push origin HEAD:main
          echo "PUSH OK — finalize's GITHUB_TOKEN push to main works."
