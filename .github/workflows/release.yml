name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  schedule:
    # Automatic nightly every 3 hours (UTC). Only proceeds when main has
    # changed since the last nightly tag (see check_changes job below).
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - stable
          - nightly
        default: stable
      version:
        description: "Release version (e.g. 0.10.4 or v0.10.4). Optional: stable defaults to the latest nightly's version; nightly ignores this."
        type: string
        required: false
      dry_run:
        description: "Build + sign only; create no GitHub Release and publish nothing"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Build/meta jobs only read the repo. The release job elevates to contents:write
# (see below) to create the release and upload assets.
permissions:
  contents: read

jobs:
  # ── Skip scheduled runs when main has not changed since the last nightly ──
  check_changes:
    name: Check for changes since last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Compare HEAD to last nightly tag
        run: |
          set -euo pipefail
          last_nightly_tag=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "No previous nightly tag found. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_nightly_sha=$(git rev-parse "$last_nightly_tag^{commit}")
          head_sha=$(git rev-parse HEAD)

          if [[ "$last_nightly_sha" == "$head_sha" ]]; then
            echo "No changes on main since last nightly release ($last_nightly_tag). Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected on main since $last_nightly_tag ($last_nightly_sha → $head_sha). Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Resolve channel / version / tag / prerelease / make_latest ───────────────
  release_meta:
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so a stable dispatch without a version input can
          # derive it from the most recent nightly tag.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            # Tag push: the tag is the source of truth.
            tag="$REF_NAME"
            version="${tag#v}"
            if printf '%s' "$version" | grep -q -- '-nightly\.'; then
              channel="nightly"; is_prerelease="true"; make_latest="false"
            else
              channel="stable"; is_prerelease="false"; make_latest="true"
            fi
            name="$tag"
            dry_run="false"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # Scheduled run is always a nightly.
            channel="nightly"
            dry_run="false"
            meta="$(bun run scripts/release/resolve-nightly-release.ts \
              --date "$(date -u +%Y%m%d)" \
              --run-number "$RUN_NUMBER" \
              --sha "$SHA")"
            version="$(printf '%s\n' "$meta" | grep '^version=' | cut -d= -f2-)"
            tag="$(printf '%s\n' "$meta" | grep '^tag=' | cut -d= -f2-)"
            name="$(printf '%s\n' "$meta" | grep '^name=' | cut -d= -f2-)"
            is_prerelease="true"; make_latest="false"
          else
            # workflow_dispatch
            channel="${INPUT_CHANNEL:-stable}"
            dry_run="${INPUT_DRY_RUN:-false}"
            if [ "$channel" = "nightly" ]; then
              # Compute X.Y.(Z+1)-nightly.YYYYMMDD.N from apps/electron/package.json.
              meta="$(bun run scripts/release/resolve-nightly-release.ts \
                --date "$(date -u +%Y%m%d)" \
                --run-number "$RUN_NUMBER" \
                --sha "$SHA")"
              version="$(printf '%s\n' "$meta" | grep '^version=' | cut -d= -f2-)"
              tag="$(printf '%s\n' "$meta" | grep '^tag=' | cut -d= -f2-)"
              name="$(printf '%s\n' "$meta" | grep '^name=' | cut -d= -f2-)"
              is_prerelease="true"; make_latest="false"
            else
              # Stable dispatch: the version input is the source of truth when
              # given. When omitted, derive it from the most recent nightly tag
              # (its stable core) — a stable release always ships the version
              # that was last validated on nightly.
              raw="${INPUT_VERSION:-}"
              if [ -z "$raw" ]; then
                latest_nightly="$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)"
                if [ -z "$latest_nightly" ]; then
                  echo "No 'version' input and no nightly tag to derive the stable version from. Cut a nightly first or pass version." >&2
                  exit 1
                fi
                # vX.Y.Z-nightly.YYYYMMDD.N -> X.Y.Z
                raw="${latest_nightly#v}"
                raw="${raw%%-nightly.*}"
                echo "No version input; derived stable version '$raw' from latest nightly '$latest_nightly'."
              fi
              version="${raw#v}"
              if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
                echo "Invalid release version: $raw" >&2
                exit 1
              fi
              tag="v$version"
              name="$tag"
              is_prerelease="false"; make_latest="true"
            fi
          fi

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$name"
            echo "is_prerelease=$is_prerelease"
            echo "make_latest=$make_latest"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: channel=$channel version=$version tag=$tag prerelease=$is_prerelease make_latest=$make_latest dry_run=$dry_run"

          {
            echo "## Release parameters"
            echo "| | |"
            echo "|---|---|"
            echo "| **channel** | \`$channel\` |"
            echo "| **version** | \`$version\` |"
            echo "| **tag** | \`$tag\` |"
            echo "| **prerelease** | \`$is_prerelease\` |"
            echo "| **make_latest** | \`$make_latest\` |"
            echo "| **dry_run** | \`$dry_run\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Stable releases must ship versioned What's New notes. Nightlies don't
      # (they don't promote next.md). This gate runs in release_meta so it fails
      # fast on both dry runs and real releases, before any build work.
      - name: Require stable release notes
        if: steps.meta.outputs.channel == 'stable'
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          notes="apps/electron/resources/release-notes/${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Stable release ${version} is missing release notes at ${notes}. Promote next.md to ${version}.md (see docs/operations/release.md) before releasing." >&2
            exit 1
          fi
          echo "Found release notes: $notes"

  # ── Fail fast if macOS signing secrets are absent ────────────────────────────
  signing_gate:
    needs: release_meta
    if: ${{ !failure() && !cancelled() && needs.release_meta.result == 'success' }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run scripts/release/check-macos-release-signing.ts

  # ── Build packaged artifacts per platform ────────────────────────────────────
  build:
    needs: [release_meta, signing_gate]
    if: ${{ !failure() && !cancelled() && needs.release_meta.result == 'success' && needs.signing_gate.result == 'success' }}
    runs-on: ${{ matrix.os }}
    # macOS is the primary release gate. Windows/Linux are unsigned best-effort
    # legs that must not block the release if they fail (Platform assumption).
    continue-on-error: ${{ matrix.platform != 'mac' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
          - os: macos-14
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Align package versions to release version
        env:
          RELEASE_VERSION: ${{ needs.release_meta.outputs.version }}
        run: bun run scripts/release/update-release-package-versions.ts "$RELEASE_VERSION"

      - name: Generate electron-builder release config
        shell: bash
        run: |
          set -euo pipefail
          out="${{ github.workspace }}/apps/electron/electron-builder.generated.yml"
          bun run scripts/build/release-config.ts \
            --version "${{ needs.release_meta.outputs.version }}" \
            --channel "${{ needs.release_meta.outputs.channel }}" \
            --repository "${{ github.repository }}" \
            --arch "${{ matrix.arch }}" \
            --out "$out"
          echo "ELECTRON_BUILDER_CONFIG=$out" >> "$GITHUB_ENV"

      - name: Build macOS (signed + notarized)
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash apps/electron/scripts/build-dmg.sh ${{ matrix.arch }}

      - name: Build Linux (unsigned, best-effort)
        if: matrix.platform == 'linux'
        run: bash apps/electron/scripts/build-linux.sh ${{ matrix.arch }}

      - name: Build Windows (unsigned, best-effort)
        if: matrix.platform == 'win'
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File apps/electron/scripts/build-win.ps1

      - name: Suffix x64 macOS updater manifest
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in apps/electron/release/*-mac.yml; do
            mv "$manifest" "${manifest%.yml}-x64.yml"
          done

      - name: Collect release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.exe
            apps/electron/release/*.AppImage
            apps/electron/release/*.blockmap
            apps/electron/release/*.yml

  # ── Create the GitHub Release and upload assets ──────────────────────────────
  release:
    needs: [release_meta, build]
    if: ${{ !failure() && !cancelled() && needs.release_meta.result == 'success' && needs.build.result == 'success' && needs.release_meta.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is not assumed writable; grant it explicitly here.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in dist/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              bun run scripts/release/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_meta.outputs.tag }}
          name: ${{ needs.release_meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.release_meta.outputs.is_prerelease }}
          make_latest: ${{ needs.release_meta.outputs.make_latest }}
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Commit the version bump back to main after a stable release ─────────────
  # Mirrors kata-code's finalize job. After a stable release ships, the desktop
  # package version must be bumped on main so the NEXT nightly resolves to
  # X.Y.(Z+1)-nightly.* instead of reusing the just-released stable version.
  # Runs only for successful, non-dry-run stable releases.
  finalize:
    needs: [release_meta, release]
    if: ${{ !failure() && !cancelled() && needs.release_meta.result == 'success' && needs.release.result == 'success' && needs.release_meta.outputs.channel == 'stable' && needs.release_meta.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Push the post-release version bump back to main with the built-in token.
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Update version strings
        id: update_versions
        env:
          RELEASE_VERSION: ${{ needs.release_meta.outputs.version }}
        run: bun run scripts/release/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: bun install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ needs.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json apps/electron/package.json apps/cli/package.json bun.lock; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json apps/electron/package.json apps/cli/package.json bun.lock
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main

  # ── npm CLI publish — publishes @kata-sh/agents-cli to npm ──────────────────
  # Publishes the renamed terminal client (@kata-sh/agents-cli / bin kata-agents-cli)
  # from main on stable releases. Gated: main ref + stable channel + not a dry run,
  # so PRs/branches/nightly-when-unversioned never publish. Requires the NPM_TOKEN
  # repo secret. Nightly dist-tag publishing can be enabled by relaxing the channel
  # gate once nightly version bumping is in place.
  publish_cli:
    needs: [release_meta, release]
    if: github.ref == 'refs/heads/main' && needs.release_meta.outputs.channel == 'stable' && needs.release_meta.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CLI bundle
        # esbuild bundles src/index.ts into dist/cli.cjs (Node shebang) — no runtime workspace deps.
        run: cd apps/cli && bun run build
      - name: Setup npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          registry-url: https://registry.npmjs.org
      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CHANNEL="${{ needs.release_meta.outputs.channel }}"
          TAG="${CHANNEL}"
          if [ "$CHANNEL" = "stable" ]; then TAG="latest"; fi
          cd apps/cli && npm publish --tag "$TAG" --access public --ignore-scripts
