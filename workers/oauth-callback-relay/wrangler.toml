name = "kata-oauth-callback-relay"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Route only the public OAuth callback path through this worker.
# Other agents.kata.sh routes remain on their existing owners (for example Vercel).
routes = [
  { pattern = "agents.kata.sh/auth/callback", zone_name = "kata.sh" }
]

[vars]
# Comma-separated exact origins allowed for hosted HTTPS return targets.
# Confirm staging/production WebUI origins before deploy and extend this list.
KATA_OAUTH_RELAY_ALLOWED_RETURN_ORIGINS = "https://agents.kata.sh"
